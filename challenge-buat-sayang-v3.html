<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>buat kamuu 🩷</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Caveat:wght@600;700&family=Quicksand:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --pink:#ff7fa8;
    --pink-deep:#ec5a8c;
    --lilac:#c9a8ff;
    --lilac-deep:#a884f0;
    --cream:#fff6fb;
    --brown:#5c4152;
    --gold:#ffc98b;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent; user-select:none;}
  html,body{height:100%;}
  body{
    margin:0;
    min-height:100vh;
    background:
      radial-gradient(circle at 10% 8%, #ffe3ef 0%, transparent 42%),
      radial-gradient(circle at 92% 12%, #ece0ff 0%, transparent 45%),
      radial-gradient(circle at 85% 90%, #ffe9d9 0%, transparent 42%),
      linear-gradient(180deg, #fff6fb 0%, #fdf1fb 100%);
    font-family:'Quicksand', sans-serif;
    color:var(--brown);
    display:flex;
    align-items:center;
    justify-content:center;
    overflow-x:hidden;
    padding:22px 16px;
    position:relative;
  }
  .stage{ width:100%; max-width:420px; position:relative; z-index:2; }
  .screen{ display:none; text-align:center; animation:fadeUp .55s ease forwards; }
  .screen.active{ display:block; }
  @keyframes fadeUp{ from{opacity:0; transform:translateY(16px);} to{opacity:1; transform:translateY(0);} }

  .card{
    background:#fffdfe;
    border-radius:38px 38px 44px 44px / 42px 42px 48px 48px;
    padding:36px 26px 30px;
    box-shadow:0 24px 50px rgba(236,90,140,.16), 0 2px 0 #fff inset;
    position:relative;
    border:1.5px solid #ffe2ee;
  }
  .sticker{ position:absolute; font-size:22px; opacity:.9; pointer-events:none; }
  .st1{ top:-14px; left:18px; transform:rotate(-12deg); }
  .st2{ top:-10px; right:14px; transform:rotate(14deg); font-size:18px; }
  .st3{ bottom:-12px; left:26px; transform:rotate(10deg); font-size:16px; }

  .eyebrow{ font-family:'Caveat', cursive; font-size:21px; color:var(--pink-deep); margin-bottom:2px; }
  h1.title{ font-family:'Fredoka', sans-serif; font-weight:600; font-size:21px; color:var(--pink-deep); margin:0 0 12px; line-height:1.4; }
  .sub{ font-size:13.5px; color:#8a6b7f; line-height:1.7; margin-bottom:24px; }

  .btn{
    appearance:none; border:none; cursor:pointer;
    font-family:'Fredoka', sans-serif; font-weight:500; font-size:14px;
    padding:13px 30px; border-radius:999px;
    background:linear-gradient(135deg,var(--pink),var(--lilac-deep));
    color:#fff; box-shadow:0 10px 20px rgba(168,132,240,.32);
    transition:transform .12s ease;
  }
  .btn:active{ transform:scale(.94); }
  .btn.ghost{ background:transparent; color:var(--pink-deep); box-shadow:none; border:1.5px solid #ffd4e4; }

  .intro-emoji{ font-size:48px; margin-bottom:6px; display:inline-block; animation:wiggle 2.4s ease-in-out infinite; }
  @keyframes wiggle{ 0%,100%{transform:rotate(0);} 25%{transform:rotate(-9deg);} 75%{transform:rotate(9deg);} }

  .progress-wrap{
    width:100%; height:14px; background:#ffe6f0; border-radius:999px;
    overflow:hidden; margin:14px 0 6px; border:1.5px solid #ffd4e4; position:relative;
  }
  .progress-bar{
    height:100%; width:0%; border-radius:999px;
    background:linear-gradient(90deg,var(--gold),var(--pink),var(--lilac-deep));
    transition:width .25s ease;
  }
  .count-num{ font-family:'Fredoka', sans-serif; font-size:14px; color:var(--pink-deep); margin-bottom:18px; }

  .tap-zone{ position:relative; height:150px; display:flex; align-items:center; justify-content:center; margin-bottom:6px; }
  .tap-btn{
    width:120px; height:120px; border-radius:50%;
    background:radial-gradient(circle at 32% 28%, #fff, #ffdcea 72%);
    border:2.5px solid #ffc3dc;
    display:flex; align-items:center; justify-content:center;
    font-size:54px; cursor:pointer;
    box-shadow:0 16px 30px rgba(236,90,140,.24);
    transition:transform .08s ease;
  }
  .tap-btn:active{ transform:scale(.86); }
  .pulse-ring{
    position:absolute; width:120px; height:120px; border-radius:50%;
    border:2.5px solid var(--lilac-deep); opacity:0; pointer-events:none;
  }
  .pulse-ring.go{ animation:ring .5s ease-out forwards; }
  @keyframes ring{ 0%{ transform:scale(1); opacity:.6; } 100%{ transform:scale(1.75); opacity:0; } }

  .floater{ position:absolute; font-size:22px; pointer-events:none; animation:floatUpSmall 1s ease-out forwards; }
  @keyframes floatUpSmall{
    0%{ transform:translateY(0) scale(.6); opacity:0; }
    30%{ opacity:1; transform:translateY(-14px) scale(1.1); }
    100%{ transform:translateY(-90px) scale(.9); opacity:0; }
  }

  .milestone-msg{ min-height:24px; font-family:'Caveat', cursive; font-size:19px; color:var(--lilac-deep); margin-top:6px; }

  .finale-gif{ width:130px; border-radius:20px; margin-bottom:10px; box-shadow:0 12px 24px rgba(236,90,140,.22); }
  .finale-title{ font-family:'Fredoka', sans-serif; font-weight:600; font-size:21px; color:var(--pink-deep); margin:2px 0 16px; }
  .finale-text{ font-size:13.5px; line-height:1.85; color:#5c4152; margin-bottom:16px; text-align:left; min-height:1em; }
  .finale-text b{ color:var(--pink-deep); }
  .type-cursor{ display:inline-block; width:2px; background:var(--pink-deep); margin-left:1px; animation:blink 1s step-end infinite; }
  @keyframes blink{ 50%{ opacity:0; } }

  .reply-box{ margin-top:14px; }
  .btn-row{ display:flex; gap:10px; justify-content:center; }

  .name-note{ font-size:10.5px; color:#cba9bd; margin-top:20px; line-height:1.6; }

  .fh-layer{ position:fixed; inset:0; pointer-events:none; overflow:hidden; z-index:0; }
  .fh{ position:absolute; bottom:-40px; font-size:18px; opacity:.9; animation:floatUpBig linear forwards; }
  @keyframes floatUpBig{ to{ transform:translateY(-112vh) rotate(25deg); opacity:0; } }

  .sparkle{ position:fixed; pointer-events:none; opacity:.55; animation:twinkle 3s ease-in-out infinite; z-index:1; }
  @keyframes twinkle{ 0%,100%{ opacity:.2; transform:scale(.8);} 50%{ opacity:.7; transform:scale(1.1);} }

  .credit{
    position:fixed;
    bottom:10px; left:14px;
    font-size:10.5px;
    color:#d8b7c9;
    z-index:3;
    font-family:'Quicksand', sans-serif;
  }
</style>
</head>
<body>

<audio id="bgm" src="https://feeldreams.github.io/audio/angelbaby.mp3" loop preload="none"></audio>

<div class="fh-layer" id="hearts"></div>
<div class="credit">made with love by frans💗</div>

<div class="stage">

  <!-- screen 0: intro -->
  <div class="screen active" id="screen-0">
    <div class="card">
      <span class="sticker st1">✨</span>
      <span class="sticker st2">🌷</span>
      <span class="sticker st3">💗</span>
      <div class="intro-emoji">🩷</div>
      <h1 class="title">haiiii cintakuuuuuuuuuuu💗🥰😘🤏</h1>
      <button class="btn" onclick="startExperience()">buka</button>
    </div>
  </div>

  <!-- screen 1: challenge -->
  <div class="screen" id="screen-1">
    <div class="card">
      <span class="sticker st1">💫</span>
      <span class="sticker st2">🎀</span>
      <div class="eyebrow">challenge buat kamuu 😆</div>
      <h1 class="title" style="font-size:18px;">tap emojinya sebanyak 25 kali yaa cintaaa💗🫣</h1>

      <div class="progress-wrap"><div class="progress-bar" id="bar"></div></div>
      <div class="count-num"><span id="count">0</span> / 25 🩷</div>

      <div class="tap-zone" id="tapZone">
        <div class="pulse-ring" id="ring"></div>
        <button class="tap-btn" id="tapBtn" onclick="handleTap(event)">🩷</button>
      </div>

      <div class="milestone-msg" id="milestoneMsg">semangat, satu tap dulu 👇</div>
    </div>
  </div>

  <!-- screen 2: finale -->
  <div class="screen" id="screen-2">
    <div class="card">
      <span class="sticker st1">🌷</span>
      <span class="sticker st2">🤍</span>
      <img class="finale-gif" src="https://htmlku.com/0/panda/fotbar.gif" alt="panda">
      <div class="finale-title">yeay, sayangkuuu berhasil!</div>

      <p class="finale-text" id="ft1"></p>
      <p class="finale-text" id="ft2"></p>
      <p class="finale-text" id="ft3"></p>

      <div class="reply-box" id="replyBox" style="display:none;">
        <div class="btn-row">
          <button class="btn" onclick="balesWa()">bales</button>
        </div>
      </div>
    </div>
  </div>

</div>

<script>
  function goTo(n){
    document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
    document.getElementById('screen-'+n).classList.add('active');
    window.scrollTo({top:0, behavior:'smooth'});
  }

  function startExperience(){
    const bgm = document.getElementById('bgm');
    bgm.volume = 0.6;
    bgm.play().catch(()=>{ /* autoplay might be blocked until user gesture, this counts as one */ });
    goTo(1);
  }

  const TARGET = 25;
  let count = 0;
  const milestoneMsgs = {
    1: "eciee udah mulai tap 😆",
    5: "lanjuutt, semangat yaa 🩷",
    10: "udah setengah jalan nih!",
    15: "duh makin deket, jangan berhenti 😳",
    20: "dikit lagiii, kamu pasti bisa!",
    24: "satu lagi... ayo!!"
  };
  const emojiSet = ['🩷','💗','💌','✨','😘'];

  function handleTap(e){
    if(count >= TARGET) return;
    count++;
    document.getElementById('count').textContent = count;
    document.getElementById('bar').style.width = (count/TARGET*100) + '%';

    const ring = document.getElementById('ring');
    ring.classList.remove('go');
    void ring.offsetWidth;
    ring.classList.add('go');

    const zone = document.getElementById('tapZone');
    const f = document.createElement('div');
    f.className = 'floater';
    f.textContent = emojiSet[Math.floor(Math.random()*emojiSet.length)];
    const rect = document.getElementById('tapBtn').getBoundingClientRect();
    f.style.left = (rect.width/2 - 10 + (Math.random()*40-20)) + 'px';
    f.style.top = (rect.height/2 - 10) + 'px';
    zone.appendChild(f);
    setTimeout(()=> f.remove(), 1000);

    if(milestoneMsgs[count]){
      document.getElementById('milestoneMsg').textContent = milestoneMsgs[count];
    }

    if(count >= TARGET){
      document.getElementById('milestoneMsg').textContent = "yeay, selesai! 🎉";
      setTimeout(()=>{ goTo(2); burstHearts(); startTyping(); }, 500);
    }
  }

  function burstHearts(){
    const container = document.getElementById('hearts');
    const symbols = ['💕','💗','🤍','💖','✨','🩷','🌷'];
    for(let i=0;i<32;i++){
      setTimeout(()=>{
        const fh = document.createElement('div');
        fh.className = 'fh';
        fh.textContent = symbols[Math.floor(Math.random()*symbols.length)];
        fh.style.left = Math.random()*100 + 'vw';
        fh.style.fontSize = (14 + Math.random()*16) + 'px';
        fh.style.animationDuration = (3 + Math.random()*2.5) + 's';
        container.appendChild(fh);
        setTimeout(()=> fh.remove(), 6000);
      }, i*55);
    }
  }

  // continuous ambient hearts floating in background, always running
  function spawnAmbientHeart(){
    const container = document.getElementById('hearts');
    const symbols = ['💗','🤍','💕','🩷'];
    const fh = document.createElement('div');
    fh.className = 'fh';
    fh.textContent = symbols[Math.floor(Math.random()*symbols.length)];
    fh.style.left = Math.random()*100 + 'vw';
    fh.style.fontSize = (12 + Math.random()*12) + 'px';
    fh.style.animationDuration = (5 + Math.random()*3) + 's';
    container.appendChild(fh);
    setTimeout(()=> fh.remove(), 9000);
  }
  setInterval(spawnAmbientHeart, 1200);

  function spawnSparkle(){
    const s = document.createElement('div');
    s.className = 'sparkle';
    s.textContent = ['✨','🌸','💫'][Math.floor(Math.random()*3)];
    s.style.left = Math.random()*100 + 'vw';
    s.style.top = Math.random()*100 + 'vh';
    s.style.fontSize = (10 + Math.random()*10) + 'px';
    document.body.appendChild(s);
    setTimeout(()=> s.remove(), 3200);
  }
  setInterval(spawnSparkle, 900);

  // typewriter effect for finale paragraphs
  const paragraphs = [
    { id:'ft1', text:'aku jatuh cinta bukan karena kamu sempurna, tapi karena di balik segala kekuranganmu, aku selalu menemukan alasan untuk tetap bertahan, kebersamaan, dan learn sama sama grow sama sama sampai waktu yang tak terhingga bersamamu🌷🤍💗' },
    { id:'ft2', text:'entah mengapa, setiap detik bersamamu terasa seperti rumah, tenang, hangat, dan selalu ingin kuperjuangkan ku jaga ku rawat cintaaaa ini seterusnya foreverrr and everrr🥹💖' },
    { id:'ft3', text:'i love youuuuuuu more than words can say. always and foreverrrrr 🫶💖💗ilysmmmmm😘💗💗💗💗💗💗💗💗💗💗💗💗💗💗💗' }
  ];
  let typingStarted = false;

  function startTyping(){
    if(typingStarted) return;
    typingStarted = true;
    typeParagraph(0);
  }

  function typeParagraph(idx){
    if(idx >= paragraphs.length){
      document.getElementById('replyBox').style.display = 'block';
      return;
    }
    const p = paragraphs[idx];
    const el = document.getElementById(p.id);
    el.innerHTML = '<span class="typed"></span><span class="type-cursor">&nbsp;</span>';
    const typedSpan = el.querySelector('.typed');
    let i = 0;
    const speed = 18;
    function step(){
      if(i < p.text.length){
        typedSpan.textContent += p.text[i];
        i++;
        setTimeout(step, speed);
      } else {
        el.querySelector('.type-cursor').remove();
        setTimeout(()=> typeParagraph(idx+1), 350);
      }
    }
    step();
  }

  function balesWa(){
    const msg = "gemessssss sayanggggggg💗😘🤏";
    const url = "https://wa.me/6285236144049?text=" + encodeURIComponent(msg);
    window.open(url, '_blank');
  }
</script>
</body>
</html>
